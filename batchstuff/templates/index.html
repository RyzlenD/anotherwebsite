<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Viewer Dashboard</title>
    <style>
        body {
            margin: 0; background: #0d0e15; color: #fff;
            font-family: sans-serif; display: flex; flex-direction: column; align-items: center;
        }
        h1 { margin-top: 40px; color: #3b82f6; text-transform: uppercase; letter-spacing: 2px; }
        .container { width: 80%; max-width: 800px; margin-top: 30px; }
        .user-card {
            background: #1a1c2e; padding: 20px; margin: 10px 0; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #2e3152;
        }
        .live-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; inline-size: display; margin-right: 10px; }
        .watch-btn {
            background: #3b82f6; color: white; padding: 10px 20px; text-decoration: none;
            border-radius: 50px; font-weight: bold; transition: 0.2s;
        }
        .watch-btn:hover { background: #2563eb; transform: scale(1.05); }
        .no-users { text-align: center; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>
    <h1>Welcome to The LIVE VIEWER YESS</h1>
    
    <div class="container">
        <h3>Active Live Streams:</h3>
        {% if users %}
            {% for user in users %}
                <div class="user-card">
                    <div style="display: flex; align-items: center;">
                        <span class="live-dot"></span>
                        <span>IP Address: <strong>{{ user }}</strong></span>
                    </div>
                    <a href="/watch/{{ user }}" class="watch-btn">WATCH</a>
                </div>
            {% endfor %}
        {% else %}
            <p class="no-users">No active streams found. Send a ping from a PC to go live.</p>
        {% endif %}
    </div>

    <script>
        // Auto-refresh home page every 5 seconds to look for new connections
        setTimeout(() => { location.reload(); }, 5000);
    </script>
</body>
</html>
